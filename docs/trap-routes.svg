<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
<title id="title">Four moves cost 28. Eight moves cost 8.</title>
<desc id="desc">Two copies of the same three-row five-column grid. The direct route crosses three weight-nine cells. The detour follows the bottom row and costs eight.</desc>
