name: Reproducible bug / گزارش باگ
description: Steps, expected and actual results for a reproducible defect.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Reports are public. Remove personal details and secrets from screenshots.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / مراحل بازتولید
      description: For the browser demo, include edits and run/reset/pause steps. For Python/C, include the exact command and algorithm.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / نتیجه مورد انتظار
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / نتیجه واقعی
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment and release/commit
      description: Browser/device for the demo; OS, Python version and C compiler version (if used) for command-line runs.
    validations:
      required: true
  - type: textarea
    id: map
    attributes:
      label: Smallest failing map / کوچک‌ترین نقشه مشکل‌دار
      description: Paste plain ASCII map text, including the height/width line. For browser-only problems, describe the grid or attach a screenshot if text is unavailable.
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Command output or error / خروجی یا خطا
      description: Include the JSON output, full error text and exit status when available. A valid map with no route returns cost null and exit status zero.
      render: text
